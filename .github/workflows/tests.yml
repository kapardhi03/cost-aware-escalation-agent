name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is 3.12 and the matrix starts there, because CPython 3.12 made
        # `sum()` over floats use compensated summation and two committed exactness
        # claims depend on it. Declared in tests/reproduction.py as MIN_PYTHON, with
        # the reason in WHY_MIN_PYTHON; test_reproduction.py asserts this list and
        # that constant agree, so neither can move alone. The 3.10 leg this replaces
        # could not pass.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No secrets are configured for this job, and none are needed: the suite
      # stubs both SDKs and asserts that no test reaches the network. A test that
      # started making real calls would fail here rather than quietly bill someone.
      - name: Run tests
        run: python -m pytest when-to-escalate

      - name: Offline smoke test
        run: python when-to-escalate/src/belief.py
